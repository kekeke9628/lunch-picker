<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 점심 뭐 먹지</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#fff; --surface-2:#f0efec; --line:#e2e0da;
  --text:#22201c; --muted:#6f6a61; --accent:#d8542f; --accent-soft:#fdeee8;
  --good:#2f7d5a; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --r:14px; color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16151a; --surface:#1f1e24; --surface-2:#282730; --line:#35333d;
    --text:#eceaf0; --muted:#9d99a6; --accent:#ff7d54; --accent-soft:#2f2019;
    --good:#5fc396; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#16151a; --surface:#1f1e24; --surface-2:#282730; --line:#35333d;
  --text:#eceaf0; --muted:#9d99a6; --accent:#ff7d54; --accent-soft:#2f2019;
  --good:#5fc396; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
       "Malgun Gothic",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%} [hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.brand{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.brand h1{font-size:18px;margin:0;letter-spacing:-.02em}
.brand .sub{color:var(--muted);font-size:12.5px;margin-left:auto}
.tabs{display:flex;gap:4px;padding-bottom:10px}
.tabs button{
  padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;
  color:var(--muted);
}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}

/* ---------- cards / controls ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:14px 0;box-shadow:var(--shadow);
}
.card h2{font-size:13px;letter-spacing:.04em;color:var(--muted);
  text-transform:uppercase;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row+.row{margin-top:14px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
select,input[type=text],input[type=number],textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);
}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);font-size:13.5px;font-weight:500;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.btn{
  padding:13px 18px;border-radius:12px;background:var(--accent);color:#fff;
  font-weight:700;font-size:15px;width:100%;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:13.5px;width:auto}

/* ---------- results ---------- */
.pick{
  display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;
  transition:transform .12s,border-color .12s,box-shadow .12s;
}
.pick.lit{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:scale(1.015)}
.pick.won{border-color:var(--good);box-shadow:0 0 0 3px rgba(47,125,90,.16)}
.pick .em{font-size:26px;line-height:1.2;flex:none}
.pick .body{min-width:0;flex:1}
.pick .nm{font-weight:700;font-size:15.5px;letter-spacing:-.01em;
  overflow-wrap:anywhere}
.pick .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.pick .tg{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pick .tg span{font-size:11px;padding:2px 7px;border-radius:999px;
  background:var(--surface-2);color:var(--muted)}
.pick a.map{font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;
  flex:none;align-self:center}

.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}

/* ---------- modal ---------- */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal{
  background:var(--surface);border-radius:18px;padding:22px;width:100%;
  max-width:420px;box-shadow:var(--shadow);max-height:88vh;overflow:auto;
}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
.vs{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin:8px 0}
.duel{
  width:100%;padding:18px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface-2);text-align:left;
}
.duel:hover{border-color:var(--accent)}
.duel .nm{font-weight:700;font-size:16px}
.duel .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.winner{text-align:center;padding:14px 0 6px}
.winner .em{font-size:46px}
.winner .nm{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.winner .meta{color:var(--muted);font-size:13.5px;margin-top:5px}

/* ---------- lists ---------- */
.item{
  display:flex;gap:10px;align-items:center;padding:11px 0;
  border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:none}
.item .body{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:12px;margin-top:2px}
.item.off .nm,.item.off .meta{opacity:.4;text-decoration:line-through}
.mini{padding:6px 10px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--line);font-size:12px;font-weight:600;flex:none}

.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bar .lb{width:66px;flex:none;color:var(--muted)}
.bar .tr{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .fl{height:100%;background:var(--accent);border-radius:999px}
.bar .ct{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

@media (max-width:420px){
  .brand .sub{display:none}
  .pick a.map{align-self:flex-start;margin-top:2px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <span style="font-size:22px">🍽️</span>
      <h1>오늘 점심 뭐 먹지</h1>
      <span class="sub" id="poolInfo"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-pick"  aria-selected="true"  onclick="ui.tab('pick')">추천받기</button>
      <button role="tab" id="tab-list"  aria-selected="false" onclick="ui.tab('list')">식당 관리</button>
      <button role="tab" id="tab-log"   aria-selected="false" onclick="ui.tab('log')">기록</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ============ 추천받기 ============ -->
  <section id="view-pick">
    <div class="card">
      <h2>어디서 먹나요</h2>
      <div class="row">
        <div style="flex:1;min-width:180px">
          <label class="f" for="loc">회사 위치</label>
          <select id="loc" onchange="ui.setLoc(this.value)"></select>
        </div>
        <div style="flex:1;min-width:150px">
          <label class="f">도보 <span class="val" id="walkV">15분</span> 이내</label>
          <input type="range" id="walk" min="3" max="25" step="1" value="15"
                 oninput="ui.setWalk(this.value)">
        </div>
      </div>
      <p class="note" id="locNote"></p>
    </div>

    <div class="card">
      <h2>오늘 조건</h2>
      <div class="row">
        <div style="flex:1;min-width:150px">
          <label class="f">예산 <span class="val" id="budV">15,000원</span>까지</label>
          <input type="range" id="bud" min="7000" max="25000" step="1000" value="15000"
                 oninput="ui.setBud(this.value)">
        </div>
      </div>
      <div class="row" style="display:block">
        <label class="f">인원</label>
        <div class="chips" id="party"></div>
      </div>
      <div class="row" style="display:block">
        <label class="f">오늘 기분 <span style="opacity:.7">(여러 개 고를 수 있어요)</span></label>
        <div class="chips" id="mood"></div>
      </div>
      <div class="row" style="display:block">
        <label class="f">이런 날</label>
        <div class="chips" id="weather"></div>
      </div>
    </div>

    <button class="btn" onclick="app.recommend(false)">🎲 메뉴 5개 뽑기</button>

    <div id="results" style="margin-top:18px"></div>
  </section>

  <!-- ============ 식당 관리 ============ -->
  <section id="view-list" hidden>
    <div class="card">
      <h2>안 먹는 종류 빼기</h2>
      <div class="chips" id="excl"></div>
      <p class="note">선택한 종류는 추천에서 완전히 제외됩니다.</p>
    </div>

    <div class="card">
      <h2>식당 직접 추가</h2>
      <div class="row">
        <div style="flex:2;min-width:160px">
          <label class="f" for="nn">가게 이름</label>
          <input type="text" id="nn" placeholder="예: 김씨네 순대국">
        </div>
        <div style="flex:1;min-width:110px">
          <label class="f" for="nc">종류</label>
          <select id="nc"></select>
        </div>
        <div style="flex:1;min-width:90px">
          <label class="f" for="nw">도보(분)</label>
          <input type="number" id="nw" min="1" max="40" value="5">
        </div>
        <div style="flex:1;min-width:100px">
          <label class="f" for="np">1인 가격</label>
          <input type="number" id="np" min="1000" step="500" placeholder="10000">
        </div>
      </div>
      <div class="row">
        <button class="btn sm" onclick="app.addCustom()">추가하기</button>
        <span class="note" style="margin:0" id="addMsg"></span>
      </div>
      <p class="note">현재 선택한 위치(<span id="addLoc"></span>) 기준으로 저장됩니다.</p>
    </div>

    <div class="card">
      <h2>근처 식당 <span id="listCount" style="color:var(--accent)"></span></h2>
      <div id="listBody"></div>
      <p class="note">가격은 종류별 평균 추정치입니다. 실제와 다르면 눌러서 고쳐주세요 —
        고친 값은 이 브라우저에 저장되고 추천에 바로 반영됩니다.</p>
    </div>

    <div class="card">
      <h2>데이터 백업</h2>
      <div class="row">
        <button class="btn sm ghost" onclick="app.exportData()">JSON 내려받기</button>
        <button class="btn sm ghost" onclick="app.copyData()">클립보드 복사</button>
        <button class="btn sm ghost" onclick="document.getElementById('imp').click()">불러오기</button>
        <input type="file" id="imp" accept="application/json" hidden onchange="app.importData(this)">
      </div>
      <p class="note" id="backupMsg">내 설정·평점·기록은 이 브라우저에만 저장됩니다.
        기기를 바꾸기 전에 내려받아 두세요.</p>
    </div>
  </section>

  <!-- ============ 기록 ============ -->
  <section id="view-log" hidden>
    <div class="card">
      <h2>이번 달 뭘 먹었나</h2>
      <div id="stats"></div>
    </div>
    <div class="card">
      <h2>최근 기록</h2>
      <div id="logBody"></div>
    </div>
  </section>

</main>

const WALK_MPM = 67, DETOUR = 1.3;

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign({}, DEFAULTS, JSON.parse(raw));
  }catch(e){ /* 사파리 비공개 모드 등 - 기본값으로 진행 */ }
  return Object.assign({}, DEFAULTS);
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ===================== 계산 ===================== */

function haversine(aLat,aLng,bLat,bLng){
  const R=6371000, rad=d=>d*Math.PI/180;
  const dLat=rad(bLat-aLat), dLng=rad(bLng-aLng);
  const h=Math.sin(dLat/2)**2 +
          Math.cos(rad(aLat))*Math.cos(rad(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function origin(){
  if(S.locId==="__here__" && S.custom) return S.custom;
  return LOCS.find(l=>l.id===S.locId) || LOCS[0];
}
function originName(){
  if(S.locId==="__here__") return S.custom ? "현재 위치" : "현재 위치(미설정)";
  return (LOCS.find(l=>l.id===S.locId)||LOCS[0]).name;
}

/** 시드 + 내가 추가한 곳을, 현재 위치 기준 도보시간을 붙여서 돌려준다. */
function pool(){
  const o = origin(), out = [];
  for(const r of SEED){
    const m = Math.max(1, Math.ceil(haversine(o.lat,o.lng,r.lat,r.lng)*DETOUR/WALK_MPM));
    out.push({id:r.i, name:r.n, cat:r.c, addr:r.a, walk:m});
  }
  for(const r of S.mine){
    if(r.loc !== S.locId) continue;
    out.push({id:r.id, name:r.name, cat:r.cat, addr:"직접 추가", walk:r.walk, mine:true});
  }
  return out.map(decorate);
}

function decorate(r){
  const ov = S.overrides[r.id] || {};
  const meta = CATS[r.cat] || CATS.korean;
  return Object.assign({}, r, {
    price: ov.price != null ? ov.price : (r.price != null ? r.price : meta.price),
    rating: ov.rating || 0,
    hidden: !!ov.hidden,
    tags: meta.tags,
    em: meta.em,
    catLabel: meta.label,
  });
}

/** 마지막 방문일로부터 며칠 지났는지. 기록 없으면 null. */
function daysSince(id){
  const hit = S.history.find(h=>h.id===id);
  if(!hit) return null;
  const diff = (new Date(today()) - new Date(hit.date)) / 86400000;
  return Math.round(diff);
}
function catDaysSince(cat){
  const hit = S.history.find(h=>h.cat===cat);
  if(!hit) return null;
  return Math.round((new Date(today()) - new Date(hit.date)) / 86400000);
}

function score(r, penalize){
  let s = 0;
  for(const m of S.moods) if(r.tags.includes(m)) s += 30;
  const partyTag = (PARTIES.find(p=>p.v===S.party)||{}).tag;
  if(partyTag && r.tags.includes(partyTag)) s += 12;
  if(S.rainy && r.tags.includes("국물")) s += 15;

  const d = daysSince(r.id);
  if(d !== null){
    if(d <= 1) s -= 60;
    else if(d <= 3) s -= 40;
    else if(d <= 7) s -= 25;
  }
  const cd = catDaysSince(r.cat);
  if(cd !== null && cd <= 3) s -= 20;

  if(r.rating) s += (r.rating - 3) * 7;
  s += (Math.random() * 20) - 10;          // 매번 같은 답이 나오지 않도록
  if(penalize && penalize.has(r.id)) s -= 45;  // "다시 굴리기"로 밀려난 곳
  return s;
}

/** 조건을 통과한 곳들 중 점수 상위 5곳. 같은 종류는 최대 2곳까지. */
function choose(penalize){
  const eligible = pool().filter(r =>
    !r.hidden &&
    r.walk <= S.walk &&
    r.price <= S.budget &&
    !S.excl.includes(r.cat)
  );
  const ranked = eligible
    .map(r => ({r, s:score(r, penalize)}))
    .sort((a,b) => b.s - a.s);

  const out = [], perCat = {};
  for(const {r} of ranked){
    if(out.length >= 5) break;
    if((perCat[r.cat]||0) >= 2) continue;
    perCat[r.cat] = (perCat[r.cat]||0) + 1;
    out.push(r);
  }
  // 종류 제한 때문에 5개를 못 채웠으면 남은 곳으로 보충
  if(out.length < 5){
    for(const {r} of ranked){
      if(out.length >= 5) break;
      if(!out.includes(r)) out.push(r);
    }
  }
  return {picks:out, total:eligible.length};
}

function modal(build){

  const mask = el("div",{className:"mask"});

  mask.onclick = e => { if(e.target === mask) close(); };

  mask.append(box); root.append(mask);
  build(box, close);
  return close;
}

/** 룰렛: 카드를 빠르게 훑다가 서서히 느려지며 한 곳에 멈춘다. */
function roulette(picks){
  const target = Math.floor(Math.random() * picks.length);
  const cards  = picks.map(r => document.querySelector('.pick[data-id="' + r.id + '"]'));
  let i = 0, step = 0;
  const total = picks.length * 3 + target + 1;   // 3바퀴 돌고 목표에서 정지

  (function tick(){
    cards.forEach(c => c && c.classList.remove("lit"));
    const cur = cards[i % picks.length];
    if(cur) cur.classList.add("lit");
    step++;
    if(step >= total){
      cards.forEach(c => c && c.classList.remove("lit"));
      const w = cards[target]; if(w) w.classList.add("won");
      setTimeout(() => announce(picks[target], picks), 380);
      return;
    }
    i++;
    setTimeout(tick, 60 + Math.pow(step / total, 3) * 260);
  })();
}

/** 1:1 대결: 이긴 곳이 다음 상대를 만나는 서바이벌. 5곳이면 4판. */
function duel(picks){
  const queue = picks.slice();
  let champ = queue.shift(), round = 1;
  const rounds = picks.length - 1;

  function next(){
    if(!queue.length){ announce(champ, picks); return; }
    const rival = queue.shift();
    modal((box, close) => {
      box.append(el("h3",{textContent:round + "라운드 / " + rounds}));
      box.append(el("p",{className:"lead", textContent:"둘 중에 더 끌리는 쪽은?"}));
      const mk = r => {
        const b = el("button",{className:"duel"});
        b.append(el("div",{className:"nm", textContent:r.em + " " + r.name}));
        b.append(el("div",{className:"meta",
          textContent:r.catLabel + " · 도보 " + r.walk + "분 · " + won(r.price)}));
        b.onclick = () => { champ = r; round++; close(); next(); };
        return b;
      };
      box.append(mk(champ));
      box.append(el("div",{className:"vs", textContent:"VS"}));
      box.append(mk(rival));
    });
  }
  next();
}

/** 가격·평점·숨김 수정 */
function editRestaurant(r){
  modal((box, close) => {
    box.append(el("h3",{textContent:r.name}));
    box.append(el("p",{className:"lead", textContent:r.catLabel + " · 도보 " + r.walk + "분"}));

    box.append(el("label",{className:"f", style:"margin-top:14px", textContent:"내 평점"}));

    let picked = r.rating;
    for(let n=1; n<=5; n++){
      const b = el("button",{className:"chip", textContent:"★".repeat(n)});
      b.dataset.n = n;
      b.setAttribute("aria-pressed", String(picked === n));

        for(const c of stars.children)

    }

    const hideRow = el("div",{className:"chips", style:"margin-top:14px"});
    const hb = el("button",{className:"chip",
      textContent: r.hidden ? "추천에서 제외됨 (누르면 해제)" : "추천에서 빼기"});
    let hidden = r.hidden;
    hb.setAttribute("aria-pressed", String(hidden));
    hb.onclick = () => {
      hidden = !hidden;
      hb.setAttribute("aria-pressed", String(hidden));
      hb.textContent = hidden ? "추천에서 제외됨 (누르면 해제)" : "추천에서 빼기";
    };
    hideRow.append(hb);
    box.append(hideRow);

    const ok = el("button",{className:"btn", style:"margin-top:18px", textContent:"저장"});
    ok.onclick = () => {
      S.overrides[r.id] = {price:+price.value || r.price, rating:picked, hidden:hidden};
      save(); close(); render.list(); render.pool();
    };
    box.append(ok);

    }
  });
}

    render.list(); render.pool();
  },

  payload(){
    return JSON.stringify({app:"lunch-picker", v:1, saved:today(), state:S}, null, 2);
  },
  exportData(){
    const blob = new Blob([app.payload()], {type:"application/json"});
    const a = el("a",{href:URL.createObjectURL(blob),
                      download:"lunch-picker-" + today() + ".json"});
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  async copyData(){
    const msg = $("#backupMsg");
    try{
      await navigator.clipboard.writeText(app.payload());
      msg.textContent = "설정을 클립보드에 복사했어요. 메모장에 붙여넣어 보관하세요.";
    }catch(e){
      msg.textContent = "복사에 실패했어요. 'JSON 내려받기'를 써주세요.";
    }
  },
  importData(input){
    const file = input.files && input.files[0];
    if(!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const data = JSON.parse(fr.result);
        if(!data || !data.state) throw new Error("형식이 다릅니다");
        S = Object.assign({}, DEFAULTS, data.state);
        save(); render.boot(); render.list(); render.log(); render.results([]);
        $("#backupMsg").textContent = "불러왔습니다 ✓";
      }catch(e){
        $("#backupMsg").textContent = "이 파일은 읽을 수 없어요: " + e.message;
      }
      input.value = "";
    };
    fr.readAsText(file);
  },
};

render.boot();
</script>
